<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vehicle C2 Node</title>
    <script src="https://unpkg.com/htmx.org@1.10.0"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-900 text-zinc-100">
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-semibold">Vehicle C2 Node</h1>
      <div id="panels" class="grid grid-cols-2 gap-4 mt-4">
        <div class="p-3 bg-zinc-800 rounded shadow">
          <h2 class="font-medium mb-2">SDR Panel</h2>
          <div id="sdr-controls">
            <button id="start-mic" class="px-3 py-1 bg-amber-600 text-black rounded">Start Mic Stream</button>
            <button id="stop-mic" class="px-3 py-1 bg-zinc-700 text-zinc-100 rounded ml-2" disabled>Stop Mic Stream</button>
            <span id="mic-status" class="ml-3 text-sm text-zinc-300">idle</span>
          </div>
          <p class="mt-3 text-sm text-zinc-400">This example captures microphone audio and streams raw audio frames over WebSocket to <code>/ws/audio/teststream</code>.</p>
        </div>
        <div class="p-3 bg-zinc-800 rounded shadow">Radio Panel (placeholder)</div>
        <div class="p-3 bg-zinc-800 rounded shadow">TAK Panel (placeholder)</div>
        <div class="p-3 bg-zinc-800 rounded shadow">System Status (placeholder)</div>
      </div>
    </div>
    <script src="/static/js/ptt-listener.js"></script>
    <script src="/static/js/mic-stream.js"></script>
  </body>
</html>
